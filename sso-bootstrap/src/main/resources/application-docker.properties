# 구조화 로그 (logback-spring.xml 의 docker 프로파일 + structured-console-appender)
logging.structured.format.console=logstash

# Flyway: 로컬 Compose 전용. 스테이징/운영 파이프라인에서는 production|staging 프로파일로 out-of-order=false 유지.
spring.flyway.out-of-order=true

spring.datasource.url=jdbc:postgresql://postgres:5432/sso_platform
spring.datasource.username=sso
spring.datasource.password=sso
spring.datasource.driver-class-name=org.postgresql.Driver

spring.data.redis.host=redis
spring.data.redis.port=6379

# Vault is provided by docker-compose; wiring to secret retrieval can be added per context.
sso.vault.address=http://vault:8200
sso.vault.token=root

spring.jpa.hibernate.ddl-auto=none
