# 개발 서버(공유 dev / 클라우드 dev 등): SPRING_PROFILES_ACTIVE=dev
# 연결 정보·비밀번호는 환경 변수 또는 시크릿으로만 주입하고, 이 파일에는 비밀 값을 두지 않는다.
# 예: SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD, SPRING_DATA_REDIS_HOST …

spring.jpa.hibernate.ddl-auto=none

# 히스토리 정리 전 임시 허용 가능. 가능하면 false + 마이그레이션은 항상 현재 최대 버전 이후만 추가.
spring.flyway.out-of-order=true

# 중앙 로그 수집 시 docker/production 과 동일 한 줄 JSON
logging.structured.format.console=logstash
