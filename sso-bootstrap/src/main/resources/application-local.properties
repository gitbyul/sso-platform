# 로컬 JVM + Docker Compose 인프라(postgres, redis, vault) 호스트 포트에 맞춤
# Windows 등에서 localhost가 IPv6(::1)로만 해석될 때 다른 리스너에 붙는 경우가 있어 127.0.0.1 사용

# 로그: 텍스트 콘솔 (MDC 표준 키 — 비어 있으면 빈 칸). defaults.xml 의 변환 규칙·컬러 호환
logging.pattern.console=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %clr(%5p) %clr(${PID:-}){magenta} %clr(---){faint} %clr([%15.15t]){faint} %clr([trace=%X{traceId:-} span=%X{spanId:-} tenant=%X{tenantId:-} user=%X{userId:-} client=%X{clientId:-}]){faint} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m%n%wEx

spring.datasource.url=jdbc:postgresql://127.0.0.1:5433/sso_platform
spring.datasource.username=sso
spring.datasource.password=sso
spring.datasource.driver-class-name=org.postgresql.Driver

spring.data.redis.host=127.0.0.1
spring.data.redis.port=6379

sso.vault.address=http://127.0.0.1:8200
sso.vault.token=root

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
