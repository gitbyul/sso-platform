# 로컬 JVM + Docker Compose 인프라(postgres, redis, vault) 호스트 포트에 맞춤
# Windows 등에서 localhost가 IPv6(::1)로만 해석될 때 다른 리스너에 붙는 경우가 있어 127.0.0.1 사용
spring.datasource.url=jdbc:postgresql://127.0.0.1:5433/sso_platform
spring.datasource.username=sso
spring.datasource.password=sso
spring.datasource.driver-class-name=org.postgresql.Driver

spring.data.redis.host=127.0.0.1
spring.data.redis.port=6379

sso.vault.address=http://127.0.0.1:8200
sso.vault.token=root

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
