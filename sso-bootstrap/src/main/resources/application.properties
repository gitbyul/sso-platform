spring.application.name=sso-bootstrap

# 공통 로그 레벨 (프로파일별 세부는 application-{profile}.properties, 출력 형식은 logback-spring.xml)
logging.level.root=INFO

# Flyway: 소스 db/migration -> classpath:db/migration. 버전/절차는 agent-flyway-versioning.mdc, 모듈 위치는 AGENTS.md, DDL 명명은 DATABASE_RULES.md 준수
# out-of-order 는 기본 false(staging/production 명시). 로컬·docker·dev 프로파일에서만 필요 시 true — agent-flyway-versioning.mdc
spring.flyway.locations=classpath:db/migration
spring.flyway.table=flyway_schema_history
