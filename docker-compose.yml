services:
  postgres:
    image: postgres:16-alpine
    container_name: sso-postgres
    environment:
      POSTGRES_DB: sso_platform
      POSTGRES_USER: sso
      POSTGRES_PASSWORD: sso
      # 읽기 전용 역할 sso_readonly(로컬 기본 비밀번호 동일): Flyway V0.5.0 생성, V0.5.1에서 session/key/federation 스키마 권한
    ports:
      # 호스트 5433 → 컨테이너 5432 (로컬 PostgreSQL 등이 5432를 쓰는 경우 대비)
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sso -d sso_platform"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: sso-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  vault:
    image: hashicorp/vault:1.16
    container_name: sso-vault
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: root
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    ports:
      - "8200:8200"
    command: ["vault", "server", "-dev"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8200/v1/sys/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  sso-bootstrap:
    build:
      context: .
      dockerfile: sso-bootstrap/Dockerfile
    container_name: sso-bootstrap
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/sso_platform
      SPRING_DATASOURCE_USERNAME: sso
      SPRING_DATASOURCE_PASSWORD: sso
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SSO_VAULT_ADDRESS: http://vault:8200
      SSO_VAULT_TOKEN: root
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      vault:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
